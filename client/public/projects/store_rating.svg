<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Glowing Dashboard Card -->
  <rect x="80" y="60" width="640" height="330" rx="20" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1.5"/>

  <!-- Top bar -->
  <circle cx="115" cy="95" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="132" cy="95" r="5" fill="#eab308" opacity="0.8"/>
  <circle cx="149" cy="95" r="5" fill="#22c55e" opacity="0.8"/>
  <rect x="180" y="87" width="220" height="16" rx="8" fill="rgba(255, 255, 255, 0.06)"/>
  
  <!-- Store Icon -->
  <g transform="translate(115, 140)">
    <rect x="0" y="0" width="70" height="70" rx="16" fill="rgba(0, 242, 254, 0.1)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5"/>
    <path d="M 20 48 L 20 28 L 50 28 L 50 48 Z" fill="none" stroke="#00f2fe" stroke-width="2"/>
    <path d="M 15 28 L 35 16 L 55 28 Z" fill="none" stroke="#00f2fe" stroke-width="2"/>
    <rect x="30" y="36" width="10" height="12" fill="#00f2fe" opacity="0.6"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="210" y="165" font-family="'JetBrains Mono', monospace, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="2">STORE RATING SYSTEM</text>
  <text x="210" y="195" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" fill="#94a3b8" letter-spacing="1">CUSTOMER FEEDBACK &amp; ANALYTICS PLATFORM</text>

  <!-- 5 Gold Stars Rating -->
  <g transform="translate(210, 220)">
    <path d="M 12 2 L 15 9 L 22 9 L 16 14 L 18 21 L 12 17 L 6 21 L 8 14 L 2 9 L 9 9 Z" fill="url(#goldGlow)"/>
    <path d="M 40 2 L 43 9 L 50 9 L 44 14 L 46 21 L 40 17 L 34 21 L 36 14 L 30 9 L 37 9 Z" fill="url(#goldGlow)"/>
    <path d="M 68 2 L 71 9 L 78 9 L 72 14 L 74 21 L 68 17 L 62 21 L 64 14 L 58 9 L 65 9 Z" fill="url(#goldGlow)"/>
    <path d="M 96 2 L 99 9 L 106 9 L 100 14 L 102 21 L 96 17 L 90 21 L 92 14 L 86 9 L 93 9 Z" fill="url(#goldGlow)"/>
    <path d="M 124 2 L 127 9 L 134 9 L 128 14 L 130 21 L 124 17 L 118 21 L 120 14 L 114 9 L 121 9 Z" fill="url(#goldGlow)"/>
    <text x="150" y="18" font-family="'JetBrains Mono', monospace, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">4.9 / 5.0 (VERIFIED REVIEWS)</text>
  </g>

  <!-- Mini Analytics Chart preview -->
  <g transform="translate(115, 270)">
    <rect x="0" y="0" width="570" height="90" rx="12" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.05)"/>
    <path d="M 30 65 Q 120 20, 210 50 T 390 30 T 540 15" fill="none" stroke="url(#cyanGlow)" stroke-width="3"/>
    <circle cx="540" cy="15" r="4" fill="#00f2fe"/>
    <text x="30" y="30" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10" fill="#64748b" letter-spacing="1">AUTHENTICATED USER RATINGS &amp; STORE METRICS</text>
  </g>
</svg>